<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Arsip MoU</title>
  <link rel="stylesheet" href="../ui/style.css">
</head>
<body class="login-body">
  <div class="login-container">
    <!-- Logo -->
    <img src="../ui/images/logo-kesra.png" alt="Logo Kesra Jabar" class="login-logo" />

    <!-- Judul -->
    <h2 class="login-title">Login Arsip MoU</h2>

    <!-- Form -->
    <form onsubmit="handleLogin(event)">
      <input type="email" id="email" placeholder="Email" required class="login-input" />
      <input type="password" id="password" placeholder="Password" required class="login-input" />
      <button type="submit" class="login-button">Login</button>
    </form>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Login simulasi
      window.location.href = "dashboard.html";
    }
  </script>
</body>
</html>
