<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Arsip MoU</title>
  <link rel="stylesheet" href="../ui/style.css" />
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-container">
      <img src="../ui/images/logo-kesra.png" alt="Logo Kesra" class="logo-login" />
      <h2 class="login-title">Login Arsip MoU</h2>

      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required class="login-input" />
        <input type="password" id="password" placeholder="Password" required class="login-input" />
        <button type="submit" class="login-button">Login</button>
        <p class="error-msg" id="error-msg"></p>
      </form>
    </div>
  </div>

  <!-- Supabase & login script -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="login.js"></script>
</body>
</html>
